dataset_params:
  im_path: 'data/LandscapesHQ'
  im_size : 128
  im_channels : 3
  label_json_path: 'data/mountain-labels.json'

diffusion_params:
  num_timesteps : 1000
  beta_start : 0.0001
  beta_end : 0.02

dit_params:
  patch_size : 2
  num_layers : 12
  hidden_size : 768
  num_heads : 12
  head_dim : 64
  timestep_emb_dim : 768
  num_classes : 7
  class_dropout_prob : 0.1
  training : True

autoencoder_params:
  z_channels: 4
  codebook_size : 8192
  down_channels : [128, 256, 384]
  mid_channels : [384]
  down_sample : [True, True]
  attn_down : [False, False]
  norm_channels: 32
  num_heads: 4
  num_down_layers : 2
  num_mid_layers : 2
  num_up_layers : 2

train_params:
  seed : 1111
  task_name: 'landscapeshq'
  # For Google Colab task_name: '/content/drive/MyDrive/landscapeshq'

  # VAE mode — choose one of three options:
  #   scratch    Train a custom VAE from scratch using model/vae/vae.py.
  #              Requires running the full VAE training loop first.
  #              Checkpoint: vae_autoencoder_ckpt_name
  #
  #   finetune   Start from the pre-trained Stable Diffusion VAE (diffusers)
  #              and fine-tune its weights on your dataset.
  #              Use finetune_epochs (fewer needed — weights are already good).
  #              Checkpoint: vae_autoencoder_ckpt_name  (fine-tuned state dict)
  #
  #   pretrained Use the frozen pre-trained SD VAE directly — no training needed.
  #              Fastest option; good baseline before deciding to fine-tune.
  vae_mode: 'scratch'

  # HuggingFace model for 'finetune' and 'pretrained' modes
  # Options: 'stabilityai/sd-vae-ft-mse' (recommended) | 'stabilityai/sd-vae-ft-ema'
  pretrained_vae_model: 'stabilityai/sd-vae-ft-mse'

  # Training settings for 'scratch' and 'finetune' modes
  finetune_epochs: 1              # epochs for 'finetune' mode (fewer needed — model is pretrained)
  autoencoder_epochs: 50          # epochs for 'scratch' mode
  autoencoder_batch_size: 4
  autoencoder_lr: 0.00001
  autoencoder_acc_steps: 1
  perceptual_weight: 1
  kl_weight: 0.000005
  disc_start: 2000                # step at which discriminator kicks in (scratch mode only)
  disc_weight: 0.5                # weight for the adversarial loss term (scratch mode only)
  autoencoder_img_save_steps: 64
  save_latents: True
  dit_batch_size: 32
  dit_epochs: 100
  num_samples: 8
  num_grid_rows: 2
  dit_lr: 0.00001
  dit_acc_steps: 1
  vae_latent_dir_name: 'vae_latents'
  dit_ckpt_name: 'dit_ckpt.pth'
  vae_autoencoder_ckpt_name: 'vae_autoencoder_ckpt.pth'
  vae_discriminator_ckpt_name: 'vae_discriminator_ckpt.pth'