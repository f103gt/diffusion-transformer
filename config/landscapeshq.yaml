dataset_params:
  im_path: 'data/LandscapesHQ'
  im_size : 128
  im_channels : 3
  label_json_path: 'data/mountain-labels.json'

diffusion_params:
  num_timesteps : 1000
  beta_start : 0.0001
  beta_end : 0.02

dit_params:
  patch_size : 2
  num_layers : 12
  hidden_size : 768
  num_heads : 12
  head_dim : 64
  timestep_emb_dim : 768
  num_classes : 7
  class_dropout_prob : 0.1
  training : True

train_params:
  seed : 1111
  task_name: 'landscapeshq'
  # For Google Colab task_name: '/content/drive/MyDrive/landscapeshq'
  finetune_vae: False             # set True to fine-tune the pretrained VAE weights
  finetune_epochs: 1              # epochs used when finetune_vae is True (fewer needed — model is pretrained)
  autoencoder_batch_size: 4
  autoencoder_lr: 0.00001
  autoencoder_acc_steps: 1
  perceptual_weight: 1
  kl_weight: 0.000005
  autoencoder_img_save_steps: 64
  save_latents: True
  dit_batch_size: 32
  dit_epochs: 100
  num_samples: 8
  num_grid_rows: 2
  dit_lr: 0.00001
  dit_acc_steps: 1
  vae_latent_dir_name: 'vae_latents'
  dit_ckpt_name: 'dit_ckpt.pth'
  vae_autoencoder_ckpt_name: 'vae_autoencoder_ckpt.pth'